server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy → Control Plane ────────────────────────────────────────────
    # Vite dev'de: /api-cp/* → http://localhost:8080/*  (prefix çıkarılır)
    # Burada da aynı davranış: trailing slash proxy_pass path'i sıfırlar.
    location /api-cp/ {
        proxy_pass         http://bicloud-control-plane:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── React SPA fallback ───────────────────────────────────────────────────
    # Bilinmeyen path'leri index.html'e yönlendir (client-side routing için)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset cache ───────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
