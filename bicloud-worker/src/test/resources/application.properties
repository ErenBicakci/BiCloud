spring.application.name=bicloud-worker-test
server.port=0

spring.task.scheduling.pool.size=2
worker.container-snapshot-interval-ms=60000
worker.container-snapshot-initial-delay-ms=60000
worker.http.connect-timeout-ms=1000
worker.http.read-timeout-ms=1000

docker.host=unix:///var/run/docker.sock
worker.name=test-worker
worker.ip=127.0.0.1
worker.version=1.0.0
worker.control-plane-url=http://localhost:8080

bicloud.gateway.alias=bicloud-gateway
bicloud.gateway.port=9000
bicloud.api-key=test-api-key
bicloud.gateway.url=http://localhost:9000
bicloud.gateway.api-key=test-api-key
