# BiCloud - Worker PC on Ubuntu
# Runs only this machine's gateway plus a Docker socket proxy.
# The worker app runs natively on Ubuntu.
# No PostgreSQL is started here; the database belongs to the main/control-plane PC.
#
# docker compose -f docker-compose.worker-ubuntu.yml up --build -d

services:

  bicloud-socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: bicloud-socket-proxy
    restart: unless-stopped
    environment:
      NETWORKS: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  bicloud-gateway:
    build:
      context: ./bicloud-gateway
      dockerfile: Dockerfile
    image: bicloud-gateway:latest
    pull_policy: build
    container_name: bicloud-gateway
    restart: unless-stopped
    depends_on:
      - bicloud-socket-proxy
    ports:
      - "9000:9000"
    environment:
      BICLOUD_CONTROL_PLANE_URL: ${BICLOUD_CONTROL_PLANE_URL}
      BICLOUD_CONTROL_PLANE_API_KEY: ${BICLOUD_CONTROL_PLANE_API_KEY}
      BICLOUD_GATEWAY_API_KEY: ${BICLOUD_GATEWAY_API_KEY}
      BICLOUD_GATEWAY_CONTAINER_NAME: bicloud-gateway
      BICLOUD_GATEWAY_DOCKER_HOST: ${BICLOUD_GATEWAY_DOCKER_HOST:-tcp://bicloud-socket-proxy:2375}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9000/gateway/health >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
