services:

  bicloud-gateway:
    build:
      context: ./bicloud-gateway
      dockerfile: Dockerfile
    image: bicloud-gateway:latest
    pull_policy: build
    container_name: bicloud-gateway
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      # CP address and key come from .env (see .env.example)
      BICLOUD_CONTROL_PLANE_URL: ${BICLOUD_CONTROL_PLANE_URL:?see .env.example}
      BICLOUD_GATEWAY_API_KEY: ${BICLOUD_GATEWAY_API_KEY:?see .env.example}
      BICLOUD_GATEWAY_CONTAINER_NAME: bicloud-gateway
      BICLOUD_GATEWAY_DOCKER_HOST: ${BICLOUD_GATEWAY_DOCKER_HOST:-tcp://host.docker.internal:2375}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9000/gateway/health >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
